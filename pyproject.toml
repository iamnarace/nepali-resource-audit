[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepali-resource-audit"
version = "0.1.0"
description = "Overlap, licence-hint and link-health auditor for community lists of Nepali datasets and resources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "iamnarace and contributors" }]
keywords = ["nepali", "audit", "link-check", "datasets", "open-data"]
classifiers = ["Programming Language :: Python :: 3", "Natural Language :: Nepali"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nra = "nepali_resource_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
